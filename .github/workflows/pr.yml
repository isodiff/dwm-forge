name: Pull request checks

on:
  pull_request:
    branches:
      - main

permissions: {}

jobs:
  ruff:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Ruff
        run: python -m pip install ruff==0.17.6
      - name: Check Python style
        run: |
          ruff check .
          ruff format --check .

  validate-files:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build image entrypoint binary
        run: cargo build --release --manifest-path rust-orchestrator/Cargo.toml
      - name: Validate repository files
        run: python3 scripts/validate_repo.py
      - name: Check Dockerfile
        run: docker build --check .

  rust-and-c:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install C and X11 dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxft-dev libxinerama-dev libxrender-dev libfreetype-dev xvfb patch
      - name: Check Rust lints and tests
        run: |
          cargo clippy --manifest-path rust-orchestrator/Cargo.toml -- -D warnings
          cargo test --manifest-path rust-orchestrator/Cargo.toml
      - name: Build orchestrator
        run: cargo build --release --manifest-path rust-orchestrator/Cargo.toml
      - name: Fetch, build, and run C/X11 verification
        run: |
          echo "$GITHUB_WORKSPACE/rust-orchestrator/target/release" >> "$GITHUB_PATH"
          dwm-forge fetch
          dwm-forge build --work-dir tmp-build --c-test-dir tests/c
          make -C tests/c smoke-x11

  python-tests:
    runs-on: ubuntu-latest
    needs: [rust-and-c]
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build orchestrator
        run: cargo build --release --manifest-path rust-orchestrator/Cargo.toml
      - name: Install Python test dependencies
        run: python -m pip install pytest pytest-cov
      - name: Run end-to-end tests
        run: pytest --cov=tests/python --cov-report=term-missing tests/python
