name: Publish and release

on:
  push:
    branches:
      - main

permissions: {}

jobs:
  publish-image:
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build orchestrator
        run: cargo build --release --manifest-path rust-orchestrator/Cargo.toml
      - name: Log in to GitHub Container Registry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Build and push image
        run: |
          image="ghcr.io/${{ github.repository }}:${{ github.sha }}"
          docker build --tag "$image" .
          docker push "$image"

  build-and-release:
    needs: [publish-image]
    runs-on: [self-hosted, linux, prod-builder]
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Build orchestrator
        run: cargo build --release --manifest-path rust-orchestrator/Cargo.toml
      - name: Fetch and build dwm
        run: |
          echo "$GITHUB_WORKSPACE/rust-orchestrator/target/release" >> "$GITHUB_PATH"
          dwm-forge fetch
          dwm-forge build --work-dir tmp-build --c-test-dir tests/c
      - name: Package release artifacts
        run: |
          dwm-forge package --staging-dir tmp-build --sha "${{ github.sha }}" --out-dir dist
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "build-${{ github.sha }}" \
            dist/*.tar.gz dist/config.h dist/SHA256SUMS \
            --title "dwm-forge build ${{ github.sha }}" \
            --notes "Automated dwm build for commit ${{ github.sha }}."
