[package]
name = "dwm-forge"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "dwm-forge"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
tempfile = "3"
toml = "0.8"
ureq = { version = "2", features = ["json"] }
walkdir = "2"